<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egyptian Mythology Posters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a lapis night sky with papyrus cards, matching the storybook. Single theme by choice. */
  --lapis:#10294d;--lapis-deep:#0a1b36;--nile:#1f8a9c;--gold:#f0b93f;--papyrus:#f7edcf;--papyrus-edge:#e3d19c;--ink:#2b2116;--carnelian:#cf4a2e;
  --font-display:"Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;--font-body:"Nunito","Trebuchet MS",system-ui,sans-serif;color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--lapis-deep)}
body{margin:0;background:radial-gradient(circle at 20% 0%,#1c4274 0,transparent 45%),var(--lapis);color:var(--papyrus);font-family:var(--font-body);font-size:19px;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:28px 16px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1}
header h1{font-size:clamp(2.1rem,8.5vw,3.3rem);color:var(--gold);font-weight:800}
header p{margin:10px 0 0;max-width:32em}
img,svg{max-width:100%}
figure{margin:0;background:var(--papyrus);color:var(--ink);border:3px solid var(--papyrus-edge);border-radius:22px;overflow:hidden}
figure img{display:block;width:100%;height:auto}
figcaption{padding:12px 16px 16px}
figcaption h2{font-size:1.5rem;color:var(--lapis)}
figcaption p{margin:6px 0 0;font-size:1rem}
figcaption a{color:var(--lapis);font-weight:800}

.site-nav{position:sticky;top:0;z-index:10;background:#0a1b36;border-bottom:2px solid #f0b93f}
.site-nav ul{max-width:860px;margin:0 auto;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 4px;list-style:none}
.site-nav a{display:block;padding:6px 11px;border-radius:999px;color:#f7edcf;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:800;font-size:16px;line-height:1.2;text-decoration:none}
.site-nav a:hover,.site-nav a:focus-visible{background:#16335d;outline:2px solid #f0b93f}
.site-nav a[aria-current="page"]{background:#f0b93f;color:#10294d}
</style>
</head>
<body>
<nav class="site-nav" aria-label="Site"><ul><li><a href="../">Home</a></li><li><a href="../stories/five-stories/">Stories</a></li><li><a href="../gods/">Gods</a></li><li><a href="../posters/" aria-current="page">Posters</a></li></ul></nav>
<main>
<header>
  <h1>Posters</h1>
  <p>Tap a poster to open it full size.</p>
</header>
<figure>
  <a href="top-5-egyptian-myths.png"><img src="top-5-egyptian-myths.png" alt="Poster: Top 5 Egyptian Myths, with seven gods across the top and five myth panels below" width="1536" height="1024"></a>
  <figcaption><h2>Top 5 Egyptian Myths</h2><p>Four of these myths are told in <a href="../stories/five-stories/">Five Stories from Ancient Egypt</a>. The poster's fifth myth, The Gift of the Nile, is not in the storybook.</p></figcaption>
</figure>
<figure>
  <a href="popular-egyptian-gods-and-goddesses.png"><img src="popular-egyptian-gods-and-goddesses.png" alt="Poster: Popular Egyptian Gods and Goddesses, a chart of seven gods" width="1536" height="1024"></a>
  <figcaption><h2>Popular Egyptian Gods and Goddesses</h2><p>The statues on this poster are drawings, not photos of real objects, and some name meanings are guesses. For checked facts, see the <a href="../gods/">Gods page</a>.</p></figcaption>
</figure>
</main>
</body>
</html>
